name: TemporalQA-0929
num_epochs: 15
l_num_epochs: 0
warmup_epochs: 2.5
ema: false
save_model: true
batch_size: 16
num_workers: 8

wandb:
    project_name: VQA_Experiments_2026

data:
    train:
        type: FusionDataset
        args:
            phase: train
            anno_file: ./labels/orig_split/train_list.txt
            data_prefix: ./VideoTCdataset
            sample_types:
                fragments:
                    fragments_h: 7
                    fragments_w: 7
                    fsize_h: 32
                    fsize_w: 32
                    aligned: 32
                    clip_len: 32
                    frame_interval: 1
                    num_clips: 1
    val-livevqc:
        type: FusionDataset
        args:
            phase: test
            anno_file: ./labels/orig_split/test_list.txt
            data_prefix: ./VideoTCdataset
            sample_types:
                fragments:
                    fragments_h: 7
                    fragments_w: 7
                    fsize_h: 32
                    fsize_w: 32
                    aligned: 32
                    clip_len: 32
                    frame_interval: 1
                    num_clips: 1

model:
    type: DiViDeAddEvaluator
    args:
        backbone:
            fragments:
                checkpoint: false
                pretrained: 
        backbone_size: swin_tiny_grpb
        backbone_preserve_keys: fragments
        divide_head: false
        vqa_head:
            in_channels: 768
            hidden_channels: 64
            in_frame: 32
            
optimizer:
    lr: !!float 1e-3
    backbone_lr_mult: !!float 1e-1
    wd: 0.05
        
load_path: ./pretrained_weights/swin_tiny_patch244_window877_kinetics400_1k.pth
test_load_path: ./pretrained_weights/TemporalQA-final_val-livevqc_s_dev_v0.0.pth